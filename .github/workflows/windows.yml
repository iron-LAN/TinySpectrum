name: Windows app

on:
  pull_request:
    paths:
      - "Windows/**"
      - "scripts/build-windows.ps1"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Windows beta version
        required: true
        default: 0.2.0-beta.4

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    env:
      VERSION: ${{ inputs.version || '0.2.0-beta.4' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Windows/TinySpectrum.Windows.slnx -c Release

      - name: Package self-contained app
        shell: powershell
        run: ./scripts/build-windows.ps1 -Version $env:VERSION

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: TinySpectrum-${{ env.VERSION }}-win-x64
          path: dist/TinySpectrum-${{ env.VERSION }}-win-x64.zip
          if-no-files-found: error
