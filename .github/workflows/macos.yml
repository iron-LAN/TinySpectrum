name: macOS app

on:
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "scripts/build-app.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh
