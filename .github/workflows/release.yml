name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/TinySpectrum.app TinySpectrum-${GITHUB_REF_NAME}-macOS.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "TinySpectrum-${GITHUB_REF_NAME}-macOS.zip"
          --title "TinySpectrum ${GITHUB_REF_NAME}"
          --generate-notes
