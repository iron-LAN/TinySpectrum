name: Release TinySpectrum

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/TinySpectrum.app TinySpectrum-${GITHUB_REF_NAME}-macOS.zip

      - name: Sign update archive
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          SIGN_TOOL=$(find .build/artifacts -type f -name sign_update -perm +111 -print -quit)
          test -n "$SIGN_TOOL"
          printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_TOOL" --ed-key-file - "TinySpectrum-${GITHUB_REF_NAME}-macOS.zip" > update-signature.txt
          test -s update-signature.txt

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            TinySpectrum-${{ github.ref_name }}-macOS.zip
            update-signature.txt

  windows:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test and package
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet test Windows/TinySpectrum.Windows.slnx -c Release
          ./scripts/build-windows.ps1 -Version $version

      - name: Upload Windows release file
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/TinySpectrum-*-win-x64.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then PRERELEASE="--prerelease --draft"; fi
          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TinySpectrum ${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE
